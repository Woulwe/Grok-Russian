stages:
  - build

android_apk:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:35
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
  before_script:
    - cd android
    - chmod +x gradlew 2>/dev/null || true
  script:
    - if [ -x ./gradlew ]; then ./gradlew clean assembleDebug --no-daemon; else gradle clean assembleDebug --no-daemon; fi
  artifacts:
    name: "Woulwe-Grok-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
