workflows:
  android-debug:
    name: Woulwe Grok Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Build Android debug APK
        script: |
          cd android
          gradle --version
          gradle clean assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
